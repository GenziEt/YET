name: yet_driver
description: YET driver app — smartphone-based shipment tracking for Ethiopian fleets (Android-first).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Phase 1 offline cache + sync worker (Offline Contract SS1.8)
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0
  # ---- Phase 4 DEVICE-ONLY dependencies (deliberately NOT imported in lib/) ----
  # The sandbox/analyze harness has no Flutter SDK, so these stay commented here
  # until the device build. Product code keeps a plugin-free design via typedef
  # seams instead of direct imports:
  #   * battery_plus  -> injected as PilotService's BatteryReader typedef
  #                    (features/pilot/pilot_service.dart). On device, main.dart
  #                    wires `() async => BatteryReading(levelPct: await
  #                    BatteryPlugin().batteryLevel.toDouble(), charging: ...)`.
  #   * connectivity_plus -> feeds AppRuntime.onNetworkAvailable() (§1.8.1 sync
  #                    trigger on network change to Wi-Fi/3G+) and the
  #                    network_type field of /ingest/diagnostics.
  #   * geolocator / sensors_dont_kill_my_tv -> GpsCollector positionSource and
  #                    SensorCollector source factories (features/trip/*).
  # battery_plus: ^6.0.0
  # connectivity_plus: ^6.0.0
  # geolocator: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

# SANDBOX-ONLY: the following overrides exist solely so `dart analyze` can run
# with stub packages in .tool_studio when the Flutter SDK is unavailable.
# They MUST be removed before any real `flutter pub get` / build.
dependency_overrides:
  flutter:
    path: .tool_studio/flutter_stub
  path:
    path: .tool_studio/pub_cache/hosted/pub.dev/path-0.0.0
  shared_preferences:
    path: .tool_studio/pub_cache/hosted/pub.dev/shared_preferences-0.0.0
  http:
    path: .tool_studio/pub_cache/hosted/pub.dev/http-0.0.0
  flutter_localizations:
    path: .tool_studio/flutter_localizations_stub
  flutter_test:
    path: .tool_studio/flutter_test_stub
