# ============================================================================
# YET Driver — Gradle JVM tuning (§STARTUP-OPTIMIZATION.md §5.3 / P1)
# ----------------------------------------------------------------------------
# Shipped with the repo so CI and every dev machine build with identical,
# deterministic settings. R8 full-mode + resource shrinking (app/build.gradle)
# are memory-hungry; 4 GB heap prevents "GC overhead" failures on CI runners
# building the release bundle.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError

# Parallel configuration/execution across :app + Flutter plugin subprojects.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Flutter apps are AndroidX-only; Jetifier keeps any legacy-support transitive
# dependency of the pinned plugin set (geolocator/battery_plus era) compiling.
android.useAndroidX=true
android.enableJetifier=true
