# YET edge gateway — Phase 0 + §STARTUP-OPTIMIZATION.md §5.4 handshake tier
# Responsibilities:
#  * Single public entrypoint (api + web dashboard)
#  * Tile-route caching headers per OSM tile usage policy / §1.9.3 (edge cache 24h)
#  * Reverse-proxy rate limit on auth endpoints (§1.10.4)
#  * gzip API responses (§1.9.2)
#  * Fast cold-start network handshakes: TLS session reuse, HTTP/2 multiplexing,
#    upstream keep-alive pools, tuned resolver — so the driver's FIRST request
#    after launch pays the fewest round trips possible (DNS→TCP→TLS→HTTP).
#
# DEPLOYMENT NOTE: docker-compose mounts this file at
#   /etc/nginx/conf.d/default.conf
# which is INCLUDED INSIDE the stock nginx image's top-level http{} block.
# Therefore this file must contain ONLY http-scoped directives (no events{},
# no worker_* outside http, no bare server{} at odd scopes). The `tiles`
# keys_zone referenced by proxy_cache below lives in the stock main context
# (/etc/nginx/nginx.conf) of the base image — do not redeclare it here.

# Rate limiting zones (§1.10.4): global limit at reverse proxy for auth endpoints.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ingest:10m rate=60r/m;

# Audit P0 (TLS enforcement switch): deploy-gateway.sh renders ${YET_TLS_ENFORCE}
# on the REMOTE host from its .env file (on/off) before nginx ever parses this
# file — compose env vars are NOT substituted into bind-mounted configs, hence
# the render step lives in the deploy script. When "on", every cleartext request
# on port 80 redirects to https (see the server blocks below). Staged rollouts
# may boot with "off" until the certificate is provisioned; PRODUCTION BOOT MUST
# USE YET_TLS_ENFORCE=1 together with the certbot-provisioned key material.
map $host $yet_tls_enforce {
    default ${YET_TLS_ENFORCE};
}

# §5.4 DNS: with a variable-based proxy_pass, nginx resolves container names
# through Docker's embedded DNS on every query instead of pinning the answer
# captured at startup — so an api/tiles container restart (new IP) never
# blackholes the drivers' first requests (a "cold handshake" failure mode).
# 127.0.0.11 is Docker's embedded DNS resolver (see infra/docker-compose.yml).
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 3s;

# ---- Transport tuning (§5.4) ------------------------------------------------
sendfile on;
tcp_nopush on;
tcp_nodelay on;                      # small JSON frames go out immediately

# Keep client connections alive LONGER than the Dart pool retires them
# (driver-app lib/core/net/http_clients.dart: idleTimeout = 60 s), so the
# app never reuses a socket the gateway already closed → no surprise
# reconnect+full-handshake mid-upload. 1000 requests ≈ many full trips' worth
# of cadence uploads on ONE connection.
keepalive_timeout 75s;
keepalive_requests 1000;

# ---- TLS: session reuse kills repeat handshakes ------------------------------
# Production terminates TLS here (api.yet.et / tiles.yet.et; PDPP §1.7
# Ethiopian data center; compose maps 443:443 with certs via certbot volume).
# These are http-scoped and apply to the ssl server block once enabled.
ssl_session_cache   shared:SSL:10m;  # ~40k sessions reused → repeat connects
                                       # skip the 2-RTT full handshake entirely
ssl_session_timeout 1d;
ssl_session_tickets off;             # forward-secret-friendly reuse
ssl_protocols TLSv1.2 TLSv1.3;       # TLS 1.3 = 1-RTT handshake
ssl_prefer_server_ciphers on;
# OCSP stapling: CA status arrives INSIDE the handshake — saves the client an
# extra round trip to a CA responder on every cold connect.
ssl_stapling on;
ssl_stapling_verify on;

gzip on;
gzip_types application/json application/javascript text/css image/svg+xml;
gzip_min_length 1024;

# ---- Backend connection reuse (§5.4) -----------------------------------------
# proxy_http_version 1.1 + an empty Connection header below make every proxied
# request eligible for keep-alive reuse; the client-facing keepalive_timeout
# above keeps driver sockets warm across trips. We deliberately do NOT wrap the
# backends in named upstream{} blocks here: with a variable-based proxy_pass,
# nginx resolves the REAL hostname through Docker's embedded DNS on every
# query, so an api/tiles container restart (new IP) never blackholes the
# drivers' first requests — something a static upstream would pin at startup.

server {
    # Audit P0 (TLS): ONE listen on 80. `listen 80 http2;` is the pre-1.25
    # spelling and nginx rejects a duplicate address:port pair outright —
    # the modern directive is `http2 on;` inside the server block below.
    listen 80;
    # HTTP/2 over cleartext (h2c): clients may multiplex ALL startup calls
    # (/me + config + upload + tiles) over ONE TCP connection even before the
    # 443/TLS block goes live. Dart's HttpClient speaks HTTP/1.1 today, so
    # this strictly ADDS capability — legacy clients stay on HTTP/1.1.
    # (nginx:1.27-alpine in compose supports `http2 on`; deploy-gateway.sh
    # validates with the real binary via nginx -t before any swap.)
    http2 on;
    server_name _;

    # §5.4 variable-based proxy_pass forces per-request resolution through the
    # resolver above (a literal proxy_pass would pin the IP taken at startup).
    set $api_upstream   http://api:3000;
    set $tiles_upstream http://tiles:8080;

    # ---- Audit P0 (TLS deployment blocker): port 80 is REDIRECT-ONLY. -------
    # Credentials, session tokens, driver records and GPS must never traverse
    # cleartext. When certificates are installed (see infra/scripts/tls-certbot.sh)
    # set YET_TLS_ENFORCE=1 in the gateway environment and every request is
    # bounced to https:// with 308 (permanent, method-preserving). Until then
    # the flag stays 0 so existing staging devices are not bricked mid-rollout.
    if ($yet_tls_enforce = "on") {
        return 308 https://$host$request_uri;
    }

    # ACME http-01 challenge webroot (tls-certbot.sh issues/renews through
    # ./certs/www). Must stay reachable over plain HTTP even when TLS
    # enforcement is on — hence declared BEFORE the redirect would apply to
    # it: nginx evaluates `if` per-location, so we exempt this location.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    # ---- API -> backend monolith ----
    location /api/ {
        proxy_pass $api_upstream/;
        proxy_http_version 1.1;              # required for upstream keepalive
        proxy_set_header Connection "";      # don't leak close semantics
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth endpoints: proxy-level rate limit (§1.10.4)
    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass $api_upstream/auth/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Ingest: per-driver enforcement happens in-app (60 batches/min, 429+Retry-After);
    # nginx adds a coarse per-IP backstop.
    location /api/ingest/ {
        limit_req zone=ingest burst=120 nodelay;
        proxy_pass $api_upstream/ingest/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 2m;            # batch of 100 fixes << 2m
    }

    # ---- Self-hosted tiles (tileserver-gl when enabled; placeholder until then) ----
    # Leaflet URL template: /tiles/{z}/{x}/{y}.png
    # Audit P0 (map-infrastructure blocker): the `tiles` service is opt-in
    # (compose profile "tiles"). nginx must boot EITHER WAY: the upstream
    # hostname is resolved per-request through Docker's embedded DNS, so when
    # the profile is off the lookup fails and we degrade to a loud 502 + ops
    # hint instead of crashing the gateway or blackholing every map request.
    # Provisioning order for production: build-tiles.sh -> enable --profile
    # tiles -> deploy-gateway.sh (see docs/DEPLOYMENT runbook).
    location /tiles/ {
        set $tiles_host tiles;
        proxy_pass http://$tiles_host:8080/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @tiles_unavailable;
        proxy_cache tiles;
        proxy_cache_valid 200 24h;          # §1.9.3: tiles cached at edge for 24 hours
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Tiles dataset/service not provisioned yet: fail LOUDLY but safely — the
    # body tells ops exactly which gate is missing (Retry-After = hourly check).
    location @tiles_unavailable {
        default_type text/plain;
        add_header Retry-After "3600" always;
        return 502 'tiles profile not enabled: run infra/scripts/build-tiles.sh then docker compose --profile tiles up -d tiles';
    }

    # ---- Nominatim (used by dashboard search; app talks via backend OSM Gateway) ----
    location /nominatim/ {
        proxy_pass http://nominatim:8080/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Ensure a valid identifying User-Agent upstream even if client omits it (OSM policy).
        proxy_set_header User-Agent "YET-tracking/0.1 (fleet-visibility; ops-contact@yet.local)";
        limit_req zone=auth burst=10 nodelay;
    }

    # ---- Web dashboard (React SPA) ----
    location / {
        proxy_pass http://web:80/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}

