# YET Phase 0 infrastructure — microservice-ready single-host stack.
#
# Data residency (PDPP No. 1321/2024 §1.7): this compose file MUST be deployed on a
# host physically located in Ethiopia (local VPS / data-center partner). Personal data
# collected in Ethiopia must not leave Ethiopian jurisdiction — including backups.
#
# Sizing target from blueprint §1.6: mid-sized VPS, 4 cores / 16 GB RAM.
#
# Usage:
#   cp .env.example .env   # fill secrets
#   docker compose up -d
#   ./scripts/import-osm.sh ethiopia-latest

name: yet-infra

services:
  postgres:
    image: postgis/postgis:16-3.4          # PostGIS needed in Phase 3 (geofences); free now
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yet}
      POSTGRES_USER: ${POSTGRES_USER:-yet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"              # never expose Postgres publicly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yet} -d ${POSTGRES_DB:-yet}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      # Ingest write-path tuning (§1.10.1): batch inserts dominate; durability trade-off
      # acceptable for time-series telemetry that is idempotently replayable from client.
      - postgres
      - -c
      - shared_buffers=4GB
      - -c
      - max_connections=200
      - -c
      - wal_compression=on

  redis:
    # Provisioned in Phase 0 so caching is available when needed, not retrofitted (§1.10.2).
    # Consumers: OSRM route cache (P3), Nominatim geocode cache (P3), fleet-state query (P5, TTL 30s).
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  osrm:
    # Self-hosted routing: zero per-request cost, full control (§1.6).
    # Image tag: use an osrm-* image built/pulled locally; project-name matches import script.
    image: osrm/osrm-backend:latest
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/${OSRM_PROFILE:-driving}.osrm
    volumes:
      - ./osrm/data:/data
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nominatim:
    # Self-hosted geocoding removes public-API User-Agent/rate-limit constraints (§1.6).
    image: mediagis/nominatim:4.4
    restart: unless-stopped
    environment:
      PBF_PATH: /data/additional_data/${OSM_EXTRACT:-ethiopia-latest.osm.pbf}
      IMPORT_STYLE: admin
      REPLICATION_URL: https://download.geofabrik.de/africa/${OSM_EXTRACT:-ethiopia}-updates/
      NOMINATIM_ADDRESS: 1;utf-8;Nominatim via YET
    volumes:
      - ./nominatim/data:/var/lib/postgresql/17/main
      - ./nominatim/additional_data:/data/additional_data
    ports:
      - "127.0.0.1:8081:8080"
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:8080/status.php' | grep -q OK || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  tiles:
    # Vector tile server (blueprint §1.6). Rendered AFTER the first driver pilot if raw
    # raster serving performance proves acceptable; kept here so the URL contract is stable.
    image: maptiler/tileserver-gl:latest
    restart: unless-stopped
    profiles: ["tiles"]                     # opt-in: docker compose --profile tiles up tiles
    volumes:
      - ./tiles/data:/data                  # pmtiles produced by scripts/build-tiles.sh
    ports:
      - "127.0.0.1:8082:8080"

  api:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-yet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yet}
      REDIS_URL: redis://redis:6379
      OSRM_BASE_URL: http://osrm:5000
      NOMINATIM_BASE_URL: http://nominatim:8080
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:3000:3000"

  retention:
    # §1.10.6 (Phase 5, C): nightly raw-fix downsampling one-shot. Built from
    # the `maintenance` target of backend/Dockerfile (scripts/retention.mjs +
    # dist/). NOT driven by `restart`: a cron host triggers it via
    #   docker compose --profile maintenance start retention
    # (see infra/cron/yet-retention). Idempotent — a missed night costs nothing
    # and a double run deletes nothing extra. Aggregates & notification_log are
    # never touched; each pass writes an atomic audit receipt.
    build:
      context: ../backend
      target: maintenance
    restart: "no"
    profiles: ["maintenance"]               # opt-in: docker compose --profile maintenance ...
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-yet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yet}
      REDIS_URL: redis://redis:6379
      # Retention knobs (defaults mirror backend/src/config/env.ts):
      RETENTION_AGE_DAYS: ${RETENTION_AGE_DAYS:-90}
      RETENTION_KEEP_EVERY_N: ${RETENTION_KEEP_EVERY_N:-10}
      # DRY_RUN=1 previews counts without deleting (first-week shakedown).
      DRY_RUN: ${DRY_RUN:-0}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: ../web-dashboard
    restart: unless-stopped

  gateway:
    # Single public entrypoint. Applies OSM tile-policy-consistent Cache-Control (§1.9.3)
    # and rate limits auth endpoints at the reverse proxy (§1.10.4).
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"                           # TLS terminates here; certs via certbot volume
    depends_on:
      - api
      - web
      - nominatim

volumes:
  pgdata:
